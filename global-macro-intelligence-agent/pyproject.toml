[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gmia"
version = "0.2.0"
description = "Global Macro Intelligence Agent — real-data direction-probability models with walk-forward validation (research use only, no trading)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "yfinance>=0.2.54",
    "requests>=2.31",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.57"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
