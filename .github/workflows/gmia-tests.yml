name: GMIA unit tests

on:
  pull_request:
    paths:
      - "global-macro-intelligence-agent/**"
      - ".github/workflows/gmia-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install GMIA package and test tools
        working-directory: global-macro-intelligence-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile modules
        working-directory: global-macro-intelligence-agent
        run: python -m compileall -q src/gmia scripts tests dashboard
      - name: Run tests (synthetic fixtures only, no credentials)
        working-directory: global-macro-intelligence-agent
        run: python -m pytest -q
