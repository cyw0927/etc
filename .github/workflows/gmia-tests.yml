name: GMIA unit tests

on:
  pull_request:
    paths:
      - "global-macro-intelligence-agent/**"
      - ".github/workflows/gmia-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install GMIA package and test tools
        working-directory: global-macro-intelligence-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-operations.txt
      - name: Compile modules
        working-directory: global-macro-intelligence-agent
        run: python -m compileall -q src/gmia scripts tests dashboard
      - name: Run tests (synthetic fixtures only, no credentials)
        working-directory: global-macro-intelligence-agent
        run: python -m pytest -q
      - name: Check types in data trust boundary
        working-directory: global-macro-intelligence-agent
        run: python -m mypy --ignore-missing-imports --follow-imports=silent src/gmia/data/pit.py src/gmia/data/store.py src/gmia/evaluation/backup.py

